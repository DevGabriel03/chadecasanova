<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<base target="_top">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700&display=swap">
<style>
  /* Painel do anfitrião: mesmo verde-folha do site, em formato de planilha de controle. */
  :root {
    --fundo: #f3f5ef; --papel: #fff; --tinta: #1d2a23; --tinta-2: #55645b; --linha: #d9dfd3;
    --folha: #2f6b4f; --mostarda-clara: #fbefd2; --erro: #b3362b;
    --titulo: "Young Serif", Georgia, serif; --texto: "Figtree", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fundo: #141b17; --papel: #1c2520; --tinta: #e8eee9; --tinta-2: #a7b5ac; --linha: #2e3a33;
      --folha: #6fbf95; --mostarda-clara: #3a3222; --erro: #ff8a7d; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--tinta); font: 15px/1.5 var(--texto); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font: 400 clamp(28px, 5vw, 38px)/1.1 var(--titulo); margin: 0; }
  .sobre { text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 700; color: var(--folha); margin: 0 0 6px; }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { font: 600 14px var(--texto); padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--folha);
    background: transparent; color: var(--folha); cursor: pointer; text-decoration: none; }
  .btn.pri { background: var(--folha); color: var(--papel); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .tile { background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 14px 16px; }
  .tile b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--tinta-2); font-size: 13px; }
  .abas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .abas button { font: 600 14px var(--texto); padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--linha);
    background: var(--papel); color: var(--tinta); cursor: pointer; }
  .abas button[aria-selected="true"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
  .busca { width: 100%; max-width: 340px; font: 15px var(--texto); padding: 9px 12px; border-radius: 10px;
    border: 1.5px solid var(--linha); background: var(--papel); color: var(--tinta); margin-bottom: 12px; }
  .caixa { overflow-x: auto; background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--linha); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--tinta-2); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--mostarda-clara); }
  .chip.nao { background: var(--linha); color: var(--tinta-2); }
  .excluir { font: 600 13px var(--texto); color: var(--erro); background: none; border: 0; cursor: pointer; padding: 4px 6px; white-space: nowrap; }
  .vazio, .msg { color: var(--tinta-2); padding: 18px 14px; margin: 0; }
  .erro { color: var(--erro); font-weight: 600; }
  :focus-visible { outline: 3px solid #e2ad3b; outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="sobre">Só você vê esta página</p>
      <h1>Painel do anfitrião</h1>
    </div>
    <div class="acoes">
      <button class="btn pri" id="atualizar" type="button">Atualizar</button>
      <a class="btn" id="planilha" href="#" target="_blank" rel="noopener">Abrir a planilha</a>
    </div>
  </header>

  <div class="resumo" id="resumo"></div>

  <div class="abas" role="tablist">
    <button type="button" role="tab" data-aba="presencas" aria-selected="true">Quem vai</button>
    <button type="button" role="tab" data-aba="reservas" aria-selected="false">Presentes escolhidos</button>
    <button type="button" role="tab" data-aba="contribuicoes" aria-selected="false">Contribuições</button>
  </div>
  <label for="busca" class="sobre" style="display:block">Buscar por nome</label>
  <input id="busca" class="busca" type="search" placeholder="Digite um nome">
  <div class="caixa" id="tabela"><p class="msg">Carregando…</p></div>
  <p class="msg" id="rodape"></p>
</div>

<script>
  const brl = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const dataBR = (iso) => iso ? new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
  const cpfBR = (c) => String(c || "").replace(/\D/g, "").padStart(11, "0").replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
  let dados = null, abaAtual = "presencas", pendente = null;

  const COLUNAS = {
    presencas: { aba: "Presenças", nome: "Nome", cols: [
      ["Nome", (r) => r["Nome"]],
      ["Vem?", (r) => r["Vem?"], (r) => `<span class="chip ${r["Vem?"] === "Sim" ? "" : "nao"}">${esc(r["Vem?"])}</span>`],
      ["Pessoas", (r) => r["Pessoas"], null, "num"],
      ["Acompanhantes", (r) => r["Acompanhantes"]],
      ["WhatsApp", (r) => r["WhatsApp"]],
      ["Recado", (r) => r["Recado"]],
      ["Quando", (r) => dataBR(r["Data"]), null, "num"],
    ]},
    reservas: { aba: "Reservas", nome: "Nome", cols: [
      ["Presente", (r) => r["Item"]],
      ["Quem", (r) => r["Nome"]],
      ["CPF", (r) => cpfBR(r["CPF"]), null, "num"],
      ["Como", (r) => r["Forma"], (r) => `<span class="chip">${esc(r["Forma"])}</span>`],
      ["Valor", (r) => brl(r["Valor"]), null, "num"],
      ["Quando", (r) => dataBR(r["Data"]), null, "num"],
    ]},
    contribuicoes: { aba: "Contribuições", nome: "Nome", cols: [
      ["Nome", (r) => r["Nome"]],
      ["Valor", (r) => brl(r["Valor"]), null, "num"],
      ["Recado", (r) => r["Recado"]],
      ["Quando", (r) => dataBR(r["Data"]), null, "num"],
    ]},
  };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function carregar() {
    const b = document.getElementById("atualizar");
    b.disabled = true; b.textContent = "Atualizando…";
    google.script.run.withSuccessHandler(receber).withFailureHandler(falhar).dadosAdmin();
  }
  function receber(d) {
    dados = d; pendente = null;
    document.getElementById("planilha").href = d.planilha;
    const b = document.getElementById("atualizar"); b.disabled = false; b.textContent = "Atualizar";
    document.getElementById("rodape").textContent = "Atualizado às " + new Date(d.agora).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) + ".";
    montarResumo(); montarTabela();
  }
  function falhar(e) {
    const b = document.getElementById("atualizar"); b.disabled = false; b.textContent = "Atualizar";
    document.getElementById("tabela").innerHTML = `<p class="msg erro">${esc(e && e.message || "Não foi possível carregar os dados.")}</p>`;
  }

  function montarResumo() {
    const sim = dados.presencas.filter((r) => r["Vem?"] === "Sim");
    const pessoas = sim.reduce((s, r) => s + (Number(r["Pessoas"]) || 1), 0);
    const nao = dados.presencas.length - sim.length;
    const pix = dados.reservas.filter((r) => r["Forma"] === "PIX").reduce((s, r) => s + (Number(r["Valor"]) || 0), 0);
    const contrib = dados.contribuicoes.reduce((s, r) => s + (Number(r["Valor"]) || 0), 0);
    const tiles = [
      [pessoas, `pessoas confirmadas (${sim.length} confirmações)`],
      [nao, "não vão poder ir"],
      [dados.reservas.length, "presentes escolhidos"],
      [brl(pix + contrib), "avisados por PIX (presentes + contribuições)"],
    ];
    document.getElementById("resumo").innerHTML = tiles.map(([n, t]) => `<div class="tile"><b>${esc(n)}</b><span>${esc(t)}</span></div>`).join("");
  }

  function montarTabela() {
    const cfg = COLUNAS[abaAtual];
    const q = document.getElementById("busca").value.trim().toLowerCase();
    const lista = dados[abaAtual].filter((r) => !q || String(r[cfg.nome] || "").toLowerCase().includes(q)).slice().reverse();
    const caixa = document.getElementById("tabela");
    if (!lista.length) { caixa.innerHTML = `<p class="vazio">${q ? "Ninguém com esse nome." : "Nada registrado ainda."}</p>`; return; }
    caixa.innerHTML = `<table><thead><tr>${cfg.cols.map((c) => `<th scope="col">${c[0]}</th>`).join("")}<th scope="col"><span class="sobre" style="margin:0">Ações</span></th></tr></thead><tbody>${
      lista.map((r) => `<tr>${cfg.cols.map((c) => `<td class="${c[3] || ""}">${c[2] ? c[2](r) : esc(c[1](r))}</td>`).join("")}<td>${
        pendente === r.linha
          ? `<button class="excluir" data-sim="${r.linha}">Confirmar exclusão</button> <button class="excluir" style="color:var(--tinta-2)" data-nao="1">Cancelar</button>`
          : `<button class="excluir" data-linha="${r.linha}">${abaAtual === "reservas" ? "Liberar item" : "Excluir"}</button>`
      }</td></tr>`).join("")}</tbody></table>`;
  }

  document.getElementById("tabela").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.linha) { pendente = Number(b.dataset.linha); montarTabela(); return; }
    if (b.dataset.nao) { pendente = null; montarTabela(); return; }
    if (b.dataset.sim) {
      const cfg = COLUNAS[abaAtual];
      const r = dados[abaAtual].find((x) => x.linha === Number(b.dataset.sim));
      b.disabled = true; b.textContent = "Excluindo…";
      google.script.run.withSuccessHandler(receber).withFailureHandler((err) => { pendente = null; montarTabela(); alertaErro(err); })
        .excluirLinha(cfg.aba, r.linha, r["Data"], r[cfg.nome]);
    }
  });
  function alertaErro(err) {
    document.getElementById("rodape").innerHTML = `<span class="erro">${esc(err && err.message || "Não foi possível excluir.")}</span>`;
  }

  document.querySelectorAll(".abas button").forEach((b) => b.addEventListener("click", () => {
    abaAtual = b.dataset.aba; pendente = null;
    document.querySelectorAll(".abas button").forEach((x) => x.setAttribute("aria-selected", x === b));
    if (dados) montarTabela();
  }));
  document.getElementById("busca").addEventListener("input", () => dados && montarTabela());
  document.getElementById("atualizar").addEventListener("click", carregar);
  carregar();
</script>
</body>
</html>
